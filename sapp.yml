# sapp.yml — single manifest for the sapp* suite. schema: sapp/1
# Sections mirror the legacy per-tool dotfiles (see sapptools/_project/upgrade/SPEC-manifest.md).
# A tool reads its section here FIRST; legacy dotfiles are fallback only.
schema: sapp/1
monitor:
  schema: 1
  id: sappchoir
  name: sappchoir
  description: >
    Ethereal choir & vocal-pad instrument (JUCE Standalone/VST3/AU) built on the
    SappSounds engine: live vowel morphing on a dedicated CC, breath/air
    control, ensemble size, cathedral room, agent CLI + SappLink manifest.
  status: active
  tags:
    - internal
    - audio
  owner: localteampartners@gmail.com
  urls:
    repo: https://github.com/localteampartners/sappchoir
  host:
    vps: none
  stack:
    runtime: C++20 / CMake
    framework: JUCE 8.0.15
    database: none
    key_libraries:
      - sappsounds (Sapp::Sounds engine)
      - Catch2 3.7.1
    external_services: []
  purpose: |
    Ethereal choir & vocal-pad instrument with live vowel morphing (CC20),
    breath/ensemble controls, and a cathedral room — playable by humans
    (Standalone/VST3/AU) and drivable by agents (JSON CLI + SappLink).
  features:
    - Vowel morphing via generated formant layers + live CC crossfades
    - Cathedral reverb (T60 to 20 s), breath/air, ensemble size
    - Agent CLI: inspect/validate/params/vowels/scan/render (seeded)
    - SappLink v1 manifest with drift-guard test
  checks: []
  notes: |
    Local-build instrument, no deploy target. Tags kept minimal; not a web
    property despite the template defaults.
backup:
  schema: 1
  project_id: sappchoir
  artifacts:
    - name: code
      type: git_tarball
      source: .
      tier: hot
    - name: docs
      type: project_docs
      source: _project
      tier: hot
  schedule: daily
security:
  thresholds:
    critical: 0
    high: 0
    medium: -1
    low: -1
    info: -1
  ignore: []
  disabledRules: []
  severityOverrides: {}
  scanners: []
  deepReview:
    enabled: false
    model: claude-sonnet-4-6
    maxFiles: 20
project:
  name: sappchoir
