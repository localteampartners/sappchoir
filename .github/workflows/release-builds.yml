name: release-builds

# WINDOWS ONLY (mac jobs removed 2026-08-08). Builds VST3/Standalone for
# Windows, and attaches the zips to the GitHub release for the given tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach builds to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:

  windows:
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DSAPPCHOIR_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          $art = "build/SappChoirPlugin_artefacts/Release"
          $stage = "SappChoir-$env:TAG-Windows-x64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse "$art/VST3/SappChoir.vst3" "$stage/"
          Copy-Item "$art/Standalone/SappChoir.exe" "$stage/"
          Copy-Item "build/Release/sappchoir.exe" "$stage/" -ErrorAction SilentlyContinue
          Set-Content -Path "$stage/INSTALL.txt" -Value @(
            'SappChoir — Windows x64',
            '',
            '1. Copy the SappChoir.vst3 folder to: C:\Program Files\Common Files\VST3\',
            '2. SappChoir.exe is the standalone version — run it from anywhere.',
            'Then rescan plugins in your DAW.'
          )
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
      - name: Upload to release
        shell: pwsh
        run: |
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "$env:TAG" --generate-notes }
          gh release upload "$env:TAG" "SappChoir-$env:TAG-Windows-x64.zip" --clobber
